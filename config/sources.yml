# Feeds RSS (complementam o GDELT; sem chave de API)
# MEDIDO em 2026-10-02, item por item. Nao adicione feed sem testar: feed morto
# nao da erro, devolve zero -- e voce conclui que nao houve noticia.
#   https://valor.globo.com/rss/          -> FALHOU (era o que estava aqui)
#   https://pox.globo.com/rss/valor/      -> 100 itens  (o caminho certo do Valor)
#   https://www.infomoney.com.br/mercados/feed/ -> 0 itens (a secao nao tem feed;
#                                            use o feed raiz do InfoMoney)
#   https://www.reutersagency.com/feed/   -> 404 e 401 nos demais caminhos.
#     A Reuters DESCONTINUOU o RSS publico; 401 e exigencia de licenca, nao
#     desafio anti-bot -- nao ha o que desbloquear. Ela entra pelo GDELT.
#   https://feeds.bloomberg.com/<secao>/news.rss -> 20 itens cada, funcionam.
#     Secoes validas medidas: markets, economics, industries, technology.
#     "green" devolve 404.
#
# Alemao e frances ficam LIGADOS mas o lexico nao os pontua: a porta
# score.py:IDIOMAS_LEXICO barra, porque "perte record" (frances) casava com o
# POS "record" e dava +0.60 a uma noticia de prejuizo. Eles servem ao scorer
# `llm`, que le o idioma. Para valer no lexico, seria preciso lexico proprio.
#
# DESDE 4/10/2026 o leitor padrao e o `llm`, logo estes feeds passaram a
# pontuar por padrao. MAS: se o proxy nao estiver autorizado, o sistema cai
# para o lexico e estas materias voltam a ser PULADAS -- `obs score-estado`
# mostra quantas ficaram pendentes. Feed que nao pontua nao e feed morto.
rss:
  # --- internacionais (ingles) ---
  - https://feeds.bloomberg.com/markets/news.rss
  - https://feeds.bloomberg.com/economics/news.rss
  - https://feeds.bloomberg.com/industries/news.rss
