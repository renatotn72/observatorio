# ---------------------------------------------------------------- PRECOS ---
# Fontes de COTACAO. Separadas dos feeds acima porque sao outra coisa: feed de
# noticia tem peso de veiculo, fonte de preco tem alcance e ajuste. O peso aqui
# nao existe; o que importa e o alcance real e se a serie e ajustada.
#
# A coluna `prices.origem` carimba cada barra. Sem isso, misturar fontes com
# regras de ajuste diferentes produz salto onde nao houve evento.
precos:
  yahoo_full:
    rotulo: Yahoo chart v8 — historico completo
    ativo: true
    endpoint: https://query2.finance.yahoo.com/v8/finance/chart/<PAPEL>.SA
    params: period1=0&period2=9791133200&interval=1d&events=div|split|earn
    ajustada: sim              # `adjclose` vem no proprio pacote
    papel: backfill            # complementa; nao substitui fechamento gravado
    alcance:
      diario: TUDO numa requisicao (period1=0; anterior a 2016)
      1m: janela de 8 dias por requisicao, deslizante
      5m_a_30m: janela de 60 dias por requisicao
      1h: janela de 720 dias por requisicao
    ohlcv: true
    adjclose: true             # a serie CERTA para calcular retorno
    proventos: true            # events=div|split -> tabela `proventos`
    descoberta: false
    bid_ask: false
    nota: >
      Mesma casa do `yahoo` abaixo, ENDPOINT DIFERENTE: aquele e o atalho de 2
      anos que a rotina usa; este e o backfill. Tres coisas que nenhuma outra
      fonte do projeto dava: `adjclose` (ajuste por proventos como DADO, nao
      como inferencia de "nao houve salto > 35%"), as DATAS de dividendo e
      desdobramento (que permitem conferir ajuste de qualquer serie, inclusive
      a da UOL) e o nome do papel junto do preco. Deslizar janela nao e o
      mesmo que ter historico: o teto diz quanto CABE numa resposta, nao
      quanto o Yahoo guarda. Por isso a coleta intradiaria para sozinha
      quando a janela seca e RELATA o alcance medido.
      Comportamento travado em scripts/test_yahoo.py (47 verificacoes).
  yahoo:
    rotulo: Yahoo Finance (chart, janela curta)
    ativo: true
    ajustada: provavel        # medido: nenhum salto > 35% em 10 anos
    papel: canonica           # a serie longa do banco e para ser dela
    alcance:
      diario: 10 anos
      1h: 2 anos
      15m: 1 mes
      5m: 1 mes
      1m: 5 dias
    # CORRIGIDO em 2026-10-04: estava 'false' com a nota "so fechamento", e
    # estava ERRADO. O endpoint v8/finance/chart devolve
    # indicators.quote[0].open/high/low/volume junto do fechamento, e
    # obs/prices.py:fetch_yahoo le os quatro. O erro inflava o valor da UOL.
    ohlcv: true
    descoberta: false         # nao tem endpoint de listagem: exige saber o ticker
    bid_ask: false
  brapi:
    rotulo: brapi.dev
    ativo: true
    ajustada: sim             # usa adjustedClose quando disponivel
    alcance:
      diario: 1 mes sem token; longo com BRAPI_TOKEN
    ohlcv: parcial
    nota: cota por janela no tier gratuito; nao cobre 10 papeis sem token
  uol:
    rotulo: UOL Economia
    ativo: true
    ajustada: desconhecida    # ver obs/uol.py:conferir_ajuste
    papel: complemento        # entra SEM apagar: obs/prices.py:grava_diario
    alcance:
      diario: 5 anos (teto fixo, sem paginacao para tras)
      1m: so a ultima sessao
    ohlcv: true               # por barra no interday; no intraday a API nao da
    descoberta: true          # catalogo paginado com id interno -- o diferencial
    bid_ask: nao_verificado   # vem na resposta; se e por barra ou da sessao,
                              # obs/uol.py:constantes responde na 1a coleta real
    universo: ~1800 tickers catalogados
    nota: >
      NAO e fonte de backfill: e mais curta que o Yahoo em toda granularidade,
      e nem acrescenta OHLCV (o Yahoo ja da). O que ela acrescenta e
      DESCOBERTA -- catalogo de ~1.800 tickers com id, que e o insumo para sair
      dos 10 papeis da watchlist -- mais BID/ASK e uma segunda opiniao na mesma
      barra. Por isso grava com complementar=True: nao troca fechamento nem
      origem ja gravados. Tres armadilhas de mapeamento travadas em
      scripts/test_uol.py -- ver o docstring de obs/uol.py.
