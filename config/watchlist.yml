# Papéis monitorados. 'aliases' é o que o matcher procura no texto da notícia.
# 'benchmark' é usado para calcular retorno anormal (CAR).
# "__crosssec__" = retorno menos a media transversal da watchlist (remove beta de
# mercado sem dado externo; funciona no brapi gratuito).
# Com BRAPI_TOKEN definido, troque por BOVA11 para um benchmark de verdade.
benchmark: __crosssec__

tickers:
  PETR4:
    name: Petrobras
    sector: oil_gas
    aliases: [petrobras, petrobrás, petróleo brasileiro, petrobras pn, PETR4, PETR3, PBR]
  VALE3:
    name: Vale
    sector: mining
    aliases: ["vale s.a.", "vale sa", "vale do rio doce", "companhia vale", "mineradora vale", VALE3, VALE5]
  ITUB4:
    name: Itau Unibanco
    sector: banks
    aliases: [itaú unibanco, itau unibanco, banco itaú, banco itau, ITUB4, ITUB3]
  BBDC4:
    name: Bradesco
    sector: banks
    aliases: [bradesco, banco bradesco, BBDC4, BBDC3]
  BBAS3:
    name: Banco do Brasil
    sector: banks
    aliases: ["banco do brasil", BBAS3]
  ABEV3:
    name: Ambev
    sector: beverages
    aliases: [ambev, anheuser-busch inbev brasil, ABEV3]
  WEGE3:
    name: WEG
    sector: industrials
    aliases: ["weg s.a.", "weg sa", "weg equipamentos", "weg motores", WEGE3]
  MGLU3:
    name: Magazine Luiza
    sector: retail
    aliases: ["magazine luiza", magalu, MGLU3]
  B3SA3:
    name: B3
    sector: financials
    aliases: ["b3 s.a.", "b3 brasil bolsa", "bolsa brasileira", B3SA3]
  SUZB3:
    name: Suzano
    sector: pulp_paper
    aliases: [suzano, "suzano papel", SUZB3]

# ---------------------------------------------------------------------------
# UNIVERSO DE PRECOS -- 89 papeis pedidos em 04/10/2026.
#
# POR QUE ISTO E UMA LISTA SEPARADA, E NAO 89 ENTRADAS EM `tickers:`
# `tickers:` faz TRES coisas ao mesmo tempo: define quem o matcher procura na
# noticia, quem tem preco coletado, e -- o que importa aqui -- quem entra na
# media transversal que serve de benchmark (`__crosssec__`). Jogar 89 papeis
# ali trocaria o benchmark de 10 para 89 papeis, e com isso TODO retorno
# anormal do banco mudaria de valor, junto com toda medicao ja registrada em
# docs/metricas.md. Seria uma re-baseline silenciosa disparada por um
# download.
#
# Entao `universo:` coleta preco e mais nada. O benchmark continua sendo a
# media dos 10 de `tickers:` ate que a troca seja uma decisao tomada, nao um
# efeito colateral. Uma media de 89 papeis e um proxy de mercado melhor que
# uma de 10 -- mas trocar exige re-rodar as medicoes e registrar o antes e o
# depois (ver docs/precos-universo.md).
#
# Nome e setor NAO estao escritos aqui de proposito: `meta.longName` vem na
# mesma resposta do preco e e a fonte autoritativa. Digitar 89 nomes a mao
# seria inventar o que a API entrega.
#
# UMA CORRECAO NA LISTA RECEBIDA: veio "SBSPSP3", que nao existe -- sao sete
# caracteres com "SP" repetido. A Sabesp e SBSP3, e e ela que esta aqui.
#
# DOIS PARES PREDECESSOR/SUCESSOR vieram juntos, e isso esta certo: ARZZ3 e
# AZZA3 (Arezzo virou Azzas na fusao com o Grupo Soma) e NTCO3 e AXIA3
# (Natura &Co virou Axia). O papel antigo tem o historico, o novo tem o
# presente; quem descartar o antigo perde serie.
